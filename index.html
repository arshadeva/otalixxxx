<style>

#mp{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));width:min(calc(100% - 24px),500px);display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:99px;cursor:pointer}

.hb.on{color:var(--a2)}.hb.on svg{fill:currentColor}

.tm{align-self:stretch;display:flex;justify-content:space-between;color:var(--mu);font-size:12px}

#sh{position:fixed;inset:0;z-index:60;background:rgba(0,5,25,.5);display:none;align-items:flex-end;justify-content:center}#sh.open{display:flex}#sh>div{width:min(100%,560px);max-height:70dvh;overflow:auto;margin:12px;padding:20px;background:rgba(10,24,70,.72)}#sh h3{margin:0 0 14px;font-size:18px}
#ts{position:fixed;z-index:70;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-200%);padding:10px 20px;border-radius:99px;transition:transform .4s;font-weight:600;font-size:13px;white-space:nowrap}#ts.on{transform:translate(-50%,0)}

<body>

<main id="app"></main>
<div id="mp" class="glass" data-a="open" hidden><img alt=""><div class="mt"><b></b><span></span></div><button class="ib pr" id="mpp" data-a="pp" aria-label="Putar atau jeda"></button></div>

</section>

<script>
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,imgL=id=>`https://i.ytimg.com/vi/${id}/hq720.jpg`;
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let S={};try{S=JSON.parse(localStorage.otalix)||{}}catch{}
S=Object.assign({name:'Pendengar Otalix',accent:'#3d8bff',pl:[],fav:[],hist:[],cnt:{},art:{},days:[],n:0},S);
const save=()=>{try{localStorage.otalix=JSON.stringify(S)}catch{}};
const sv=(p,f)=>`<svg viewBox="0 0 24 24" ${f?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'}>${p}</svg>`;
const I={home:sv('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),search:sv('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),lib:sv('<path d="M5 4v16M10 4v16M15 5l5 15"/>'),user:sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),play:sv('<path d="M7 4l13 8-13 8z"/>',1),pause:sv('<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>',1),next:sv('<path d="M5 5l10 7-10 7zM17 5h2v14h-2z"/>',1),prev:sv('<path d="M19 5L9 12l10 7zM5 5h2v14H5z"/>',1),heart:sv('<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/>'),plus:sv('<path d="M12 5v14M5 12h14"/>'),x:sv('<path d="M6 6l12 12M18 6L6 18"/>'),down:sv('<path d="M6 9l6 6 6-6"/>'),back:sv('<path d="M15 6l-6 6 6 6"/>'),shuf:sv('<path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/>'),pen:sv('<path d="M4 20h4L19 9l-4-4L4 16z"/>')};
const LOGO='<svg viewBox="0 0 64 64"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7defff"/><stop offset="1" stop-color="#2f5bff"/></linearGradient></defs><rect width="64" height="64" rx="19" fill="url(#lgg)"/><circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="6"/><path d="M29 25l10 7-10 7z" fill="#fff"/></svg>';
const FLAME='<svg viewBox="0 0 48 48"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8f4ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient></defs><path d="M24 4c2 9 12 13 12 25a12 12 0 0 1-24 0c0-6 3-9 5-12 1 4 3 5 4 5 0-6 1-12 3-18z" fill="url(#fg)"/></svg>';
const TABS=[['home','Beranda',I.home],['cari','Cari',I.search],['pus','Pustaka',I.lib],['kamu','Kamu',I.user]];
const MOODS=[['Semangat','lagu indonesia semangat'],['Santai','lagu santai indonesia'],['Fokus','lofi fokus belajar'],['Galau','lagu galau indonesia'],['Olahraga','workout music'],['Roadtrip','lagu perjalanan indonesia']];
const ACC=[['Samudra','#3d8bff'],['Langit','#3cc8ff'],['Nila','#6b6cff'],['Es','#7fe3ff']];
/* Sumber pencarian: instance publik Piped/Invidious. Ganti daftar ini kalau ada yang mati. */
const PIPED=['https://pipedapi.kavin.rocks','https://api.piped.private.coffee','https://pipedapi.adminforge.de'],INV=['https://yewtu.be','https://inv.nadeko.net'];
const R={tab:'home',pl:null,q:'',res:null,s:'idle'},L={};
let yt,ready=false,pend=false,q=[],qi=-1,playing=false,drag=false,errs=0,AT=null,TR=null,tt;
const getPl=id=>id==='fav'?{id:'fav',n:'Favorit',t:S.fav}:S.pl.find(p=>p.id===id);
const fav=id=>S.fav.some(x=>x.id===id);
function streak(){let n=0,d=new Date();if(!S.days.includes(day(d)))d.setDate(d.getDate()-1);while(S.days.includes(day(d))){n++;d.setDate(d.getDate()-1)}return n}
async function j(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}}
async function search(s){
 const m=s.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/);
 if(m){try{const o=await j('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://youtu.be/'+m[1]));return[{id:m[1],t:o.title,a:o.author_name,d:0}]}catch{return[{id:m[1],t:'Video YouTube',a:'YouTube',d:0}]}}
 for(const b of PIPED){try{const r=await j(`${b}/search?q=${encodeURIComponent(s)}&filter=music_songs`),it=(r.items||[]).filter(x=>x.url&&x.url.includes('v='));if(it.length)return it.map(x=>({id:x.url.split('v=')[1],t:x.title,a:(x.uploaderName||'').replace(/ - Topic$/,''),d:x.duration||0}))}catch{}}
 for(const b of INV){try{const r=await j(`${b}/api/v1/search?type=video&q=${encodeURIComponent(s)}`);if(r.length)return r.map(x=>({id:x.videoId,t:x.title,a:x.author,d:x.lengthSeconds||0}))}catch{}}
 return null}
/* Pemutar */
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('yt',{height:200,width:200,playerVars:{playsinline:1,controls:0},events:{onReady:()=>{ready=true;if(pend&&q[qi])yt.loadVideoById(q[qi].id)},onStateChange:st,onError:()=>{if(++errs<4){toast('Tidak bisa diputar, dilewati');next()}}}})};
document.head.appendChild(Object.assign(document.createElement('script'),{src:'https://www.youtube.com/iframe_api'}));
function st(ev){playing=ev.data===1||ev.data===3;if(ev.data===1)errs=0;if(ev.data===0)next();ui();if('mediaSession' in navigator)navigator.mediaSession.playbackState=playing?'playing':'paused'}
function play(l,i){q=l.slice();qi=i;go1()}
function go1(){const t=q[qi];if(!t)return;
 S.n++;S.hist=[t,...S.hist.filter(x=>x.id!==t.id)].slice(0,24);
 (S.cnt[t.id]||(S.cnt[t.id]={...t,c:0})).c++;S.art[t.a]=(S.art[t.a]||0)+1;
 const d=day();if(!S.days.includes(d))S.days.push(d);save();
 if(ready)yt.loadVideoById(t.id);else pend=true;
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.t,artist:t.a,artwork:[{src:img(t.id),sizes:'320x180'}]});
 playing=true;ui()}
const next=()=>{if(!q.length)return;qi=(qi+1)%q.length;go1()};
const prev=()=>{if(ready&&yt.getCurrentTime()>3)return yt.seekTo(0,true);if(!q.length)return;qi=(qi-1+q.length)%q.length;go1()};
const pp=()=>{if(!ready)return;yt.getPlayerState()===1?yt.pauseVideo():yt.playVideo()};
function heart(){const t=q[qi];if(!t)return;const i=S.fav.findIndex(x=>x.id===t.id);i<0?S.fav.unshift(t):S.fav.splice(i,1);save();ui();toast(i<0?'Ditambahkan ke Favorit':'Dihapus dari Favorit')}
function ui(){const t=q[qi];$('#mp').hidden=!t;if(!t)return;
 $('#mp').classList.toggle('on',playing);$('#mp img').src=img(t.id);$('#mp b').textContent=t.t;$('#mp span').textContent=t.a;
 $('#npi').src=imgL(t.id);$('#npt').textContent=t.t;$('#npa').textContent=t.a;$('#hb').classList.toggle('on',fav(t.id));
 $('#pp').innerHTML=$('#mpp').innerHTML=playing?I.pause:I.play;$('#bg').style.backgroundImage=`url(${img(t.id)})`}
setInterval(()=>{if(!ready||!yt.getDuration||drag)return;const d=yt.getDuration(),c=yt.getCurrentTime();if(!d)return;$('#sk').value=c/d*1000;$('#sk').style.setProperty('--p',c/d*100+'%');$('#c1').textContent=fmt(c);$('#c2').textContent='-'+fmt(d-c)},500);
const sk=$('#sk');
sk.addEventListener('pointerdown',()=>drag=true);
sk.addEventListener('input',()=>{sk.style.setProperty('--p',sk.value/10+'%');if(ready&&yt.getDuration)$('#c1').textContent=fmt(sk.value/1000*yt.getDuration())});
sk.addEventListener('change',()=>{drag=false;if(ready)yt.seekTo(sk.value/1000*yt.getDuration(),true)});
/* Tampilan */
const cov=(t,c='')=>`<div class="cov ${c}">${[0,1,2,3].map(i=>t[i]?`<img src="${img(t[i].id)}" alt="">`:'<i></i>').join('')}</div>`;
const row=(t,l,i,ex)=>`<div class="row glass" data-a="p" data-l="${l}" data-i="${i}"><img src="${img(t.id)}" loading="lazy" alt=""><div class="mt"><b>${e(t.t)}</b><span>${e(t.a)}${t.d?' · '+fmt(t.d):''}</span></div>${ex||`<button class="ib" data-a="add" data-l="${l}" data-i="${i}" aria-label="Tambah ke playlist">${I.plus}</button>`}</div>`;
async function trend(){if(TR)return;TR=[];const r=await search('lagu indonesia terbaru 2026');if(r){TR=r.slice(0,10);if(R.tab==='home')render()}}
function home(){
 const h=new Date().getHours(),g=h<11?'pagi':h<15?'siang':h<18?'sore':'malam',n=streak(),w=(new Date().getDay()+6)%7;
 const top=Object.values(S.cnt).sort((a,b)=>b.c-a.c).slice(0,10);if(!top.length)trend();
 L.qp=S.hist.slice(0,6);L.top=top.length?top:TR||[];
 const dots=[...'SSRKJSM'].map((c,i)=>{const d=new Date();d.setDate(d.getDate()-w+i);return`<i class="${S.days.includes(day(d))?'on':''} ${i===w?'td':''}">${c}</i>`}).join('');
 return`<header class="hd"><span class="lg">${LOGO}</span><b>Otalix</b><small>oleh Oscar Mandala</small></header><h1>Selamat ${g}</h1>
 ${L.qp.length?`<div class="qp">${L.qp.map((t,i)=>`<div class="glass" data-a="p" data-l="qp" data-i="${i}"><img src="${img(t.id)}" alt=""><span>${e(t.t)}</span></div>`).join('')}</div>`:`<div class="glass em2" data-a="tab" data-t="cari"><b>Mulai dari satu lagu</b><span>Ketuk untuk mencari musik pertamamu.</span></div>`}
 <div class="glass st"><div class="fl">${FLAME}</div><div><b>${n}</b>hari berturut-turut<p>${n?'Streak hari ini aman.':'Putar satu lagu untuk memulai streak.'}</p><div class="dots">${dots}</div></div></div>
 <div class="chips">${MOODS.map(m=>`<button class="glass" data-a="mood" data-q="${m[1]}">${m[0]}</button>`).join('')}</div>
 <h2>${top.length?'Andalanmu':'Lagi ramai'}</h2><div class="hs">${L.top.map((t,i)=>`<div data-a="p" data-l="top" data-i="${i}"><img src="${img(t.id)}" alt=""><b>${e(t.t)}</b><span>${e(t.a)}</span></div>`).join('')||'<p class="em">Memuat…</p>'}</div>`}
const cari=()=>`<h1>Cari</h1><form class="sf glass" id="sf"><input id="qi" type="search" enterkeyhint="search" placeholder="Lagu, artis, atau link YouTube" value="${e(R.q)}" autocomplete="off"><button class="ib pr" aria-label="Cari">${I.search}</button></form><div id="res"></div>`;
function showRes(){const b=$('#res');if(!b)return;L.res=R.res||[];
 b.innerHTML={load:'<p class="em">Mencari…</p>',err:'<p class="em">Server pencarian belum bisa dihubungi. Coba lagi sebentar, atau tempel link YouTube untuk langsung memutar.</p>',empty:`<p class="em">Tidak ada hasil untuk “${e(R.q)}”.</p>`,idle:'<p class="em">Cari lagu atau artis, atau tempel link YouTube.</p>'}[R.s]||L.res.map((t,i)=>row(t,'res',i)).join('')}
async function runSearch(s){if(!s)return;R.q=s;R.s='load';showRes();const r=await search(s);R.res=r||[];R.s=r?(r.length?'ok':'empty'):'err';if(R.tab==='cari')showRes()}
function pus(){if(R.pl)return detail();
 return`<h1>Pustaka</h1><button class="glass btn" data-a="newpl" style="margin-bottom:16px">${I.plus} Playlist baru</button>${[{id:'fav',n:'Favorit',t:S.fav},...S.pl].map(p=>`<div class="row glass" data-a="pl" data-id="${p.id}">${cov(p.t,'sm')}<div class="mt"><b>${e(p.n)}</b><span>${p.t.length} lagu</span></div></div>`).join('')}`}
function detail(){const p=getPl(R.pl);if(!p){R.pl=null;return pus()}L.pl=p.t;const f=p.id==='fav';
 return`<button class="glass pill" data-a="back">${I.back} Pustaka</button><div class="dh">${cov(p.t)}<h1>${e(p.n)}</h1><p>${p.t.length} lagu</p><div class="acts"><button class="btn pr" data-a="playall">${I.play} Putar</button><button class="glass btn" data-a="shufall">${I.shuf} Acak</button>${f?'':'<button class="glass btn" data-a="ren">Nama</button><button class="glass btn" data-a="del">Hapus</button>'}</div></div>${p.t.map((t,i)=>row(t,'pl',i,`<button class="ib" data-a="rm" data-i="${i}" aria-label="Hapus dari playlist">${I.x}</button>`)).join('')||'<p class="em">Playlist masih kosong. Tambahkan lagu dari tab Cari.</p>'}`}
function kamu(){const ar=Object.entries(S.art).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return`<h1>Kamu</h1><div class="glass pf"><div class="av">${e((S.name[0]||'O').toUpperCase())}</div><div class="mt"><b>${e(S.name)}</b><span>Tanpa login · data tersimpan di perangkat</span></div><button class="ib" data-a="name" aria-label="Ubah nama">${I.pen}</button></div>
 <div class="stats">${[[S.n,'diputar'],[streak(),'streak'],[S.pl.length,'playlist']].map(s=>`<div class="glass"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
 <h2>Artis teratas</h2>${ar.map((a,i)=>`<div class="row glass"><div class="rk">${i+1}</div><div class="mt"><b>${e(a[0])}</b><span>${a[1]} kali diputar</span></div></div>`).join('')||'<p class="em">Putar beberapa lagu dan artis favoritmu muncul di sini.</p>'}
 <h2>Tampilan</h2><div class="sw">${ACC.map(c=>`<button style="--c:${c[1]}" class="${S.accent===c[1]?'on':''}" data-a="acc" data-c="${c[1]}" aria-label="${c[0]}"></button>`).join('')}</div>
 <h2>Data</h2><div class="acts" style="justify-content:flex-start"><button class="glass btn" data-a="exp">Ekspor</button><button class="glass btn" data-a="rst">Reset</button></div>`}
function render(){$('#app').innerHTML={home,cari,pus,kamu}[R.tab]();if(R.tab==='cari')showRes()}
function go(t,pl=null){R.tab=t;R.pl=pl;const k=TABS.findIndex(x=>x[0]===t);$('#tb').style.setProperty('--i',k);document.querySelectorAll('#tb button').forEach((b,i)=>b.classList.toggle('on',i===k));render();scrollTo(0,0)}
const sheet=h=>{$('#sh>div').innerHTML=h;$('#sh').classList.add('open')},closeSheet=()=>$('#sh').classList.remove('open');
function addSheet(){sheet(`<h3>Tambah ke playlist</h3>${[{id:'fav',n:'Favorit',t:S.fav},...S.pl].map(p=>`<div class="row glass" data-a="addto" data-id="${p.id}">${cov(p.t,'sm')}<div class="mt"><b>${e(p.n)}</b><span>${p.t.length} lagu</span></div></div>`).join('')}<button class="glass btn" data-a="newpl" data-k="1">${I.plus} Playlist baru</button>`)}
function toast(m){const x=$('#ts');x.textContent=m;x.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>x.classList.remove('on'),2200)}
const accent=()=>document.documentElement.style.setProperty('--a',S.accent);
document.addEventListener('submit',ev=>{ev.preventDefault();const v=$('#qi').value.trim();$('#qi').blur();runSearch(v)});
document.addEventListener('click',ev=>{
 if(ev.target.id==='sh')return closeSheet();
 const el=ev.target.closest('[data-a]');if(!el)return;const d=el.dataset,a=d.a,p=()=>getPl(R.pl);
 if(a==='tab')go(d.t);
 else if(a==='p')play(L[d.l],+d.i);
 else if(a==='add'){AT=L[d.l][+d.i];addSheet()}
 else if(a==='addto'){const l=getPl(d.id);if(!l.t.some(x=>x.id===AT.id))l.t.push(AT);save();closeSheet();toast('Masuk ke '+l.n);if(R.tab==='pus')render()}
 else if(a==='newpl'){const n=prompt('Nama playlist baru');if(n&&n.trim()){const l={id:'p'+Date.now(),n:n.trim().slice(0,40),t:[]};if(d.k&&AT)l.t.push(AT);S.pl.push(l);save();toast('Playlist dibuat')}AT=null;closeSheet();if(R.tab==='pus')render()}
 else if(a==='open'){if(q[qi])$('#np').classList.add('open')}
 else if(a==='close')$('#np').classList.remove('open');
 else if(a==='pp')pp();else if(a==='next')next();else if(a==='prev')prev();else if(a==='heart')heart();
 else if(a==='mood'){R.q=d.q;go('cari');runSearch(d.q)}
 else if(a==='pl')go('pus',d.id);else if(a==='back')go('pus');
 else if(a==='playall'){if(p().t.length)play(p().t,0)}
 else if(a==='shufall'){if(p().t.length)play(p().t.slice().sort(()=>Math.random()-.5),0)}
 else if(a==='ren'){const n=prompt('Nama baru',p().n);if(n&&n.trim()){p().n=n.trim().slice(0,40);save();render()}}
 else if(a==='del'){if(confirm('Hapus playlist ini?')){S.pl=S.pl.filter(x=>x.id!==R.pl);save();go('pus')}}
 else if(a==='rm'){p().t.splice(+d.i,1);save();render()}
 else if(a==='name'){const n=prompt('Nama kamu',S.name);if(n&&n.trim()){S.name=n.trim().slice(0,24);save();render()}}
 else if(a==='acc'){S.accent=d.c;accent();save();render()}
 else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));l.download='otalix-data.json';l.click()}
 else if(a==='rst'){if(confirm('Hapus semua data Otalix di perangkat ini?')){try{localStorage.removeItem('otalix')}catch{}location.reload()}}
});
$('#tb').innerHTML='<i class="lens"></i>'+TABS.map(t=>`<button data-a="tab" data-t="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('');
$('#bp').innerHTML=I.prev;$('#bn').innerHTML=I.next;$('#hb').innerHTML=I.heart;$('.top button').innerHTML=I.down;
try{[['play',()=>yt.playVideo()],['pause',()=>yt.pauseVideo()],['nexttrack',next],['previoustrack',prev]].forEach(([a,f])=>navigator.mediaSession.setActionHandler(a,f))}catch{}
accent();go('home');
</script>
</body>
</html>
